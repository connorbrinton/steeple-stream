name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Node tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: cachix/install-nix-action@v27
      - run: npm ci
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: Build Nix package
        run: nix build .#steeple-stream
      - run: npm test

  browser:
    name: Player / ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix e2e
      - name: Install browser and media fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          cd e2e
          npx playwright install --with-deps "$BROWSER"
          bash install-mediamtx.sh
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Test production player
        working-directory: e2e
        run: npm test -- --project="$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
          MEDIAMTX_BINARY: ${{ github.workspace }}/e2e/artifacts/bin/mediamtx
      - name: Upload reports, screenshots, traces and media logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: player-${{ matrix.browser }}
          retention-days: 7
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/artifacts/*.log
