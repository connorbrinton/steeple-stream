name: Format parallel preview and early Play
on:
  push:
    branches: [fix/hybrid-webrtc-peer-failure-fallback]
    paths:
      - .github/workflows/format-parallel-preview.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/player.ts public/assets/broadcaster.ts public/assets/app.css public/assets/types.d.ts public/broadcaster.html public/assets/early-play.js e2e/specs/streaming.spec.js e2e/specs/early-play.spec.js
          git diff --cached --quiet || (git commit -m "Format parallel preview implementation" && git push)
