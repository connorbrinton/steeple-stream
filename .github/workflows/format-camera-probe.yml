name: Format camera probe branch
on:
  push:
    branches: [admin-visca-read-only-capability-probe]
    paths:
      - .github/workflows/format-camera-probe.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/viscaProbe.ts src/server.ts public/admin.html public/assets/admin.ts public/assets/app.css tests/viscaProbe.test.js
          git diff --cached --quiet || (git commit -m "Format camera diagnostics implementation" && git push)
