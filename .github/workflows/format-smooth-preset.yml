name: Format synchronized preset changes
on:
  push:
    branches: [feature/synchronized-ndi-preset-recall]
    paths:
      - .github/workflows/format-smooth-preset.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit source formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/smoothPtz.ts src/manualPtz.ts src/server.ts public/assets/broadcaster.ts public/broadcaster.html docs/smooth-preset-recall.md
          git diff --cached --quiet || (git commit -m "Format final synchronized preset adjustments" && git push)
