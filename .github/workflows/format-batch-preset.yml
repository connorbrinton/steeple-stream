name: Format automatic preset capture
on:
  push:
    branches: [feature/synchronized-ndi-preset-recall]
    paths:
      - .github/workflows/format-batch-preset.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/presetCaptureBatch.ts src/broadcastService.ts src/server.ts public/admin.html public/assets/admin.ts tests/presetCaptureBatch.test.js docs/smooth-preset-recall.md
          git diff --cached --quiet || (git commit -m "Format automatic preset capture" && git push)
