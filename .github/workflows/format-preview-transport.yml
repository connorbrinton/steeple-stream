name: Format broadcaster transport indicator
on:
  push:
    branches: [feature/broadcaster-transport-indicator]
    paths:
      - .github/workflows/format-preview-transport.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/broadcaster.html public/assets/broadcaster.ts public/assets/player.ts public/assets/app.css e2e/fixture.js e2e/specs/streaming.spec.js docs/lan-webrtc.md
          git diff --cached --quiet || (git commit -m "Format transport indicator changes" && git push)
