name: Refresh Node.js security dependency (temporary)
on:
  push:
    branches: [security/node2shell-nodejs-22-20261101]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/node2shell-nodejs-22-20261101
          persist-credentials: true
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Refresh app Nixpkgs input
        run: nix flake update nixpkgs
      - name: Ensure Node.js 22 release includes Node2Shell fix
        run: |
          version=$(nix eval --raw .#packages.x86_64-linux.steeple-stream.passthru.nodeVersion 2>/dev/null || nix eval --raw --impure --expr 'let f = builtins.getFlake (toString ./.); pkgs = import f.inputs.nixpkgs { system = "x86_64-linux"; }; in pkgs.nodejs_22.version')
          echo "Node.js runtime selected: $version"
          case "$version" in
            22.23.4|22.23.[5-9]|22.2[4-9].*) ;;
            *) echo "Node.js is not a known fixed 22.x release"; exit 1;;
          esac
      - name: Commit refreshed Nix lockfile
        run: |
          if ! git diff --quiet -- flake.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add flake.lock
            git commit -m 'security(nix): refresh Node.js 22 to fix Node2Shell'
            git push origin HEAD:security/node2shell-nodejs-22-20261101
          fi
