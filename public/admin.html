<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Steeple Stream Operator</title>
    <link rel="stylesheet" href="/assets/app.css?v=__ASSET_VERSION__">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">Steeple Stream Operator</div>
        <div class="status"><span id="status-dot" class="dot"></span><span id="status-label">Loading</span></div>
      </header>
      <section class="layout admin-grid">
        <div class="panel preview-panel">
          <h2>Preview</h2>
          <div class="video-frame admin-preview" id="admin-preview">
            <div class="slate">
              <div>
                <h1>Broadcast Offline</h1>
                <p>No stream is currently active.</p>
              </div>
            </div>
          </div>
        </div>

        <div class="panel" id="source-panel">
          <div class="panel-heading">
            <h2>Input Source</h2>
          </div>
          <div class="source-current" id="source-current"></div>
          <div class="source-toolbar">
            <div>
              <div class="control-label">Available Sources</div>
              <div class="meta" id="source-discovery-status">Checking sources.</div>
            </div>
            <button class="button compact" id="open-manual-source" type="button">Add Manual Source</button>
          </div>
          <div class="source-list" id="source-list"></div>

          <p class="meta" id="source-help"></p>
        </div>

        <div class="panel">
          <h2>Health</h2>
          <div class="meta" id="health">Checking health.</div>
        </div>

        <div class="panel" id="obs-credentials-panel" hidden>
          <h2>OBS Control Credentials</h2>
          <form id="obs-credential-form" class="source-form">
            <label>Unit name<input id="obs-unit-name" required></label>
            <label>WebSocket port<input id="obs-port" type="number" min="1024" max="65535" value="4455" required></label>
            <button class="button primary" type="submit">Create Credential</button>
          </form>
          <div class="list" id="obs-credentials"></div>
          <p class="meta" id="obs-new-password"></p>
        </div>
      </section>
    </main>
    <div class="modal-backdrop" id="manual-source-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="manual-source-title">
        <div class="modal-header">
          <h2 id="manual-source-title">Add Manual Source</h2>
          <button class="button compact" id="cancel-manual-source-x" type="button">Cancel</button>
        </div>
        <form id="source-form" class="source-form">
          <label>
            Source type
            <select id="source-type" name="type">
              <option value="ndi">NDI camera stream</option>
              <option value="network">Network encoder</option>
            </select>
          </label>

          <div class="source-fields" data-source-fields="ndi">
            <label>
              NDI source name
              <input id="add-ndi-source-name" placeholder="HOST (Source name)">
            </label>
            <label>
              Direct address
              <input id="add-ndi-url-address" placeholder="Optional host:port">
            </label>
          </div>

          <div class="source-fields" data-source-fields="network">
            <label>
              Protocol
              <select id="network-protocol">
                <option value="rtsp">RTSP</option>
                <option value="srt">SRT</option>
              </select>
            </label>
            <label>
              Source URI
              <input id="network-uri" placeholder="rtsp://encoder.local/stream">
            </label>
          </div>

          <label>
            Notes
            <textarea id="source-notes" rows="3" placeholder="Setup notes for this location"></textarea>
          </label>

          <div class="modal-actions">
            <button class="button" id="cancel-manual-source" type="button">Cancel</button>
            <button class="button primary" type="submit">Save Manual Source</button>
          </div>
        </form>
      </div>
    </div>
    <script src="/vendor/hls.light.min.js?v=__ASSET_VERSION__"></script>
    <script src="/assets/player.js?v=__ASSET_VERSION__"></script>
    <script src="/assets/admin.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
