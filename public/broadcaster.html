<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Steeple Stream Broadcaster</title>
    <link rel="stylesheet" href="/build/app.css?v=__ASSET_VERSION__" />
  </head>
  <body>
    <main class="shell broadcaster-shell">
      <header class="topbar">
        <div class="brand">Steeple Stream Broadcaster</div>
        <div class="status">
          <span id="status-dot" class="dot"></span><span id="status-label">Loading</span>
        </div>
      </header>
      <section class="layout admin-grid broadcaster-layout">
        <div class="preview-anchor">
          <div class="panel preview-panel" aria-label="Live camera preview">
            <div class="video-frame admin-preview" id="admin-preview">
              <video
                class="preview-preplay-video"
                playsinline
                preload="none"
                aria-hidden="true"
              ></video>
              <div class="slate">
                <div>
                  <h1>Broadcast Offline</h1>
                  <p>No stream is currently active.</p>
                </div>
              </div>
            </div>
            <div class="preview-start" id="preview-start">
              <button class="button primary" id="preview-play" type="button">
                Play camera preview
              </button>
              <span id="preview-play-message" role="status">Ready whenever you are</span>
            </div>
            <div
              class="preview-connection-status"
              id="preview-connection-status"
              role="status"
              aria-live="polite"
            >
              <span id="preview-transport">Connecting preview…</span>
              <span id="preview-transport-detail" class="preview-connection-detail" hidden></span>
            </div>
          </div>
        </div>
        <div class="preview-reserve" aria-hidden="true"></div>

        <div class="panel operator-panel">
          <h2>Broadcast Controls</h2>
          <div class="operator-groups">
            <div id="broadcast-controls-group" hidden>
              <div class="control-label">Scenes</div>
              <div class="controls">
                <button class="button primary" id="start">Start Broadcast</button>
                <button class="button" id="chapel">Chapel</button>
                <button class="button" id="sacrament">Sacrament</button>
                <button class="button danger" id="end">End Broadcast</button>
              </div>
            </div>
            <div>
              <div class="control-label">Camera</div>
              <label class="control-label">
                <input id="smooth-preset-recall" type="checkbox" />
                Experimental smooth preset recall (requires captured preset positions)
              </label>
              <button class="button danger compact" id="stop-camera-motion" type="button">
                Stop Camera Motion
              </button>
              <div class="ptz-groups" id="ptz-controls"></div>
              <div id="manual-camera"></div>
            </div>
          </div>
          <p class="meta" id="broadcast-details">Loading broadcast state.</p>
        </div>
      </section>
    </main>
    <dialog class="unit-dialog" id="unit-dialog" aria-labelledby="unit-dialog-title">
      <h2 id="unit-dialog-title">Which unit is broadcasting?</h2>
      <p>More than one of your assigned units could be starting now.</p>
      <div class="unit-dialog-options" id="unit-dialog-options"></div>
      <button class="button" id="unit-dialog-cancel" type="button">Cancel</button>
    </dialog>
    <script src="/assets/early-play.js?v=__ASSET_VERSION__"></script>
    <script src="/vendor/hls.min.js?v=__ASSET_VERSION__"></script>
    <script type="module" src="/build/broadcaster.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
